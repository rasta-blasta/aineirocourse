<title>Внутри нейросети</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F1F1EE; --surface:#FBFAF7; --surface2:#E9E8E2; --ink:#20242B; --muted:#68707A;
  --accent:#A76A15; --accent-bright:#E9A63A; --accent-soft:rgba(233,166,58,.14);
  --wire:#DAD8CE; --good:#2E7D4F; --good-soft:rgba(46,125,79,.12); --bad:#C64B3C; --bad-soft:rgba(198,75,60,.10);
  --chip-ink:#241A07; --shadow:0 1px 2px rgba(32,36,43,.05),0 10px 28px rgba(32,36,43,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161A; --surface:#1C1F24; --surface2:#262A31; --ink:#E9E7E1; --muted:#9AA0A8;
    --accent:#E0A23F; --accent-bright:#EFB255; --accent-soft:rgba(239,178,85,.12);
    --wire:#32363D; --good:#5CB585; --good-soft:rgba(92,181,133,.14); --bad:#E58273; --bad-soft:rgba(229,130,115,.12);
    --chip-ink:#1C1406; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#14161A; --surface:#1C1F24; --surface2:#262A31; --ink:#E9E7E1; --muted:#9AA0A8;
  --accent:#E0A23F; --accent-bright:#EFB255; --accent-soft:rgba(239,178,85,.12);
  --wire:#32363D; --good:#5CB585; --good-soft:rgba(92,181,133,.14); --bad:#E58273; --bad-soft:rgba(229,130,115,.12);
  --chip-ink:#1C1406; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.68 "Golos Text","Noto Sans SC","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}

#app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
#side{width:296px;flex:0 0 296px;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--wire);display:flex;flex-direction:column;z-index:40}
.side-head{padding:22px 20px 14px;border-bottom:1px solid var(--wire);display:flex;align-items:center;gap:12px}
.side-head .logo{cursor:pointer;background:none;border:none;text-align:left;display:flex;align-items:center;gap:12px;flex:1}
.logo-mark{width:38px;height:38px;flex:0 0 38px}
.logo-name{font-family:"Unbounded","Noto Sans SC","Noto Sans Arabic",sans-serif;font-weight:700;font-size:14px;line-height:1.25;letter-spacing:.01em}
.lang-row{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap}
.lang-b{font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:11px;letter-spacing:.05em;
  padding:4px 10px;border:1px solid var(--wire);border-radius:999px;color:var(--muted)}
.lang-b:hover{border-color:var(--accent-bright)}
.lang-b.on{border-color:var(--accent-bright);color:var(--accent);background:var(--accent-soft);font-weight:600}
.side-progress{padding:14px 20px 6px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.side-progress .bar{flex:1;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.side-progress .bar i{display:block;height:100%;background:var(--accent-bright);border-radius:3px;transition:width .4s ease}
.side-progress b{font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-weight:600;font-size:12px;color:var(--ink)}
nav.toc{padding:10px 12px 8px;flex:1}
.toc-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;
  font-size:14.5px;line-height:1.35;color:var(--ink)}
.toc-item:hover{background:var(--surface2)}
.toc-item.active{background:var(--accent-soft)}
.toc-item.locked{color:var(--muted);cursor:not-allowed}
.toc-item .num{font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:11.5px;color:var(--muted);width:20px;flex:0 0 20px}
.toc-item .st{margin-left:auto;flex:0 0 18px;display:flex;justify-content:center}
.toc-item .st svg{display:block}
.toc-sep{margin:10px 10px 6px;padding-top:10px;border-top:1px solid var(--wire);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.side-foot{padding:12px 20px 18px;border-top:1px solid var(--wire);display:flex;flex-direction:column;gap:6px}
.side-foot button{font-size:12.5px;color:var(--muted);text-align:left;padding:3px 0}
.side-foot button:hover{color:var(--accent)}

/* ---------- topbar (mobile) ---------- */
#topbar{display:none;position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--wire);
  padding:10px 14px;align-items:center;gap:12px}
#topbar .logo-name{font-size:13px}
#topbar .burger{padding:6px 10px;border:1px solid var(--wire);border-radius:8px;font-size:13px}
@media (max-width:900px){
  #app{display:block}
  #topbar{display:flex}
  #side{position:fixed;inset:0 auto 0 0;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow)}
  #side.open{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s}
  #scrim.on{opacity:1;pointer-events:auto}
}

/* ---------- main ---------- */
#main{flex:1;min-width:0}
.wrap{max-width:760px;margin:0 auto;padding:44px 28px 90px}
@media (max-width:600px){.wrap{padding:28px 18px 70px}}
.eyebrow{font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:600;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--wire)}
h1{font-family:"Unbounded","Noto Sans SC","Noto Sans Arabic",sans-serif;font-weight:700;font-size:clamp(26px,4.6vw,40px);line-height:1.16;
  letter-spacing:-.005em;text-wrap:balance;margin:14px 0 0}
.standfirst{font-size:19px;line-height:1.6;color:var(--muted);margin-top:18px;max-width:60ch}
h2{font-family:"Unbounded","Noto Sans SC","Noto Sans Arabic",sans-serif;font-weight:500;font-size:21px;line-height:1.3;text-wrap:balance;margin:46px 0 14px}
.prose{max-width:66ch;hyphens:auto}
.prose p{margin:0 0 15px}
.prose ul{margin:0 0 15px;padding-inline-start:24px}
.prose li{margin-bottom:7px}
.prose strong{font-weight:600}
.callout{border-inline-start:3px solid var(--accent-bright);background:var(--accent-soft);border-radius:10px;
  padding:14px 18px;margin:20px 0}
.callout p:last-child{margin-bottom:0}
.example{border:1px solid var(--wire);background:var(--surface);border-radius:10px;padding:16px 18px;margin:20px 0;position:relative}
.example::before{content:"Пример";font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--accent);display:block;margin-bottom:8px;font-weight:600}
.example p:last-child{margin-bottom:0}

.mod-head .minutes{color:var(--muted);font-size:14px;margin-top:14px;display:flex;gap:14px;align-items:center}
.mod-intro{font-size:18.5px;line-height:1.62;color:var(--muted);margin:18px 0 4px;max-width:62ch}

/* ---------- demo panel ---------- */
.demo{border:1px solid var(--wire);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
  margin:26px 0 6px;overflow:hidden}
.demo-tag{display:flex;align-items:center;gap:8px;padding:11px 18px;border-bottom:1px solid var(--wire);
  font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:600}
.demo-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-bright);
  box-shadow:0 0 0 3px var(--accent-soft)}
.demo-body{padding:18px}
.demo-note{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.5}
.mono{font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace}

/* controls inside demos */
.ctl-row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-bottom:14px}
.ctl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:130px}
.ctl b{color:var(--ink);font-weight:500;display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.ctl b output{font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:12.5px;color:var(--accent)}
input[type=range]{accent-color:var(--accent-bright);width:100%}
select{background:var(--surface);border:1px solid var(--wire);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}

.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 18px;font-weight:600;font-size:15px;
  background:var(--accent-bright);color:var(--chip-ink);transition:transform .06s ease, filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--wire)}
.btn.ghost:hover{background:var(--surface2)}
.btn.small{padding:7px 13px;font-size:13.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- quiz ---------- */
.quiz{border:1px solid var(--wire);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin-top:40px;overflow:hidden}
.quiz-head{padding:16px 20px;border-bottom:1px solid var(--wire);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.quiz-head h3{font-family:"Unbounded","Noto Sans SC","Noto Sans Arabic",sans-serif;font-weight:500;font-size:17px}
.quiz-head span{color:var(--muted);font-size:13.5px}
.quiz-body{padding:6px 20px 20px}
.qq{margin-top:20px}
.qq .qt{font-weight:600;margin-bottom:10px;line-height:1.5}
.qq .qt .qn{font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;color:var(--accent);font-weight:600;font-size:13px;margin-right:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--wire);border-radius:10px;
  padding:10px 14px;background:var(--surface);font-size:15.5px;line-height:1.5;transition:border-color .12s, background .12s}
.opt:hover{border-color:var(--accent-bright)}
.opt .letter{font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:12px;color:var(--muted);border:1px solid var(--wire);
  border-radius:6px;width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.sel{border-color:var(--accent-bright);background:var(--accent-soft)}
.opt.sel .letter{border-color:var(--accent-bright);color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .letter{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .letter{border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.explain{display:none;margin-top:9px;font-size:14px;line-height:1.55;color:var(--muted);border-inline-start:2px solid var(--wire);padding-inline-start:12px}
.explain.show{display:block}
.explain b{color:var(--ink)}
.quiz-actions{margin-top:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.quiz-score{font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:14px}
.quiz-score.ok{color:var(--good)} .quiz-score.no{color:var(--bad)}
.qq.unanswered .qt{color:var(--bad)}

.pass-panel{border:1px solid var(--good);background:var(--good-soft);border-radius:14px;padding:20px 22px;margin-top:22px;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pass-panel .big{font-family:"Unbounded","Noto Sans SC","Noto Sans Arabic",sans-serif;font-weight:500;font-size:17px}
.pass-panel p{font-size:14.5px;color:var(--muted);margin-top:4px}
.pass-panel .btn{margin-left:auto}

/* ---------- home ---------- */
.hero{position:relative;border:1px solid var(--wire);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);
  overflow:hidden;padding:38px 34px 34px;margin-bottom:34px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.33}
.hero>div{position:relative}
.hero .standfirst{margin-top:14px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:24px}
.hero-stats .hs b{font-family:"Unbounded","Noto Sans SC","Noto Sans Arabic",sans-serif;font-weight:500;font-size:19px;display:block}
.hero-stats .hs span{font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hero-cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media (max-width:640px){.cards{grid-template-columns:1fr}}
.card{border:1px solid var(--wire);border-radius:13px;background:var(--surface);padding:15px 17px;text-align:left;
  display:flex;flex-direction:column;gap:6px;transition:border-color .12s, transform .1s}
.card:hover{border-color:var(--accent-bright);transform:translateY(-1px)}
.card.locked{opacity:.55}
.card.locked:hover{border-color:var(--wire);transform:none}
.card .c-top{display:flex;align-items:center;gap:8px;font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card .c-top .st{margin-left:auto}
.card .c-title{font-weight:600;font-size:15.5px;line-height:1.35}
.card .c-min{font-size:12.5px;color:var(--muted)}
.home-h2{margin-top:40px}

/* ---------- misc ---------- */
.next-row{margin-top:30px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tbl{overflow-x:auto}
.bar-h{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:14px}
.bar-h .bl{width:110px;flex:0 0 110px;text-align:end;font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-h .btrack{flex:1;height:20px;background:var(--surface2);border-radius:5px;overflow:hidden;position:relative}
.bar-h .bfill{height:100%;background:var(--accent-bright);border-radius:5px;transition:width .25s ease}
.bar-h .bval{font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:12px;color:var(--muted);width:52px;flex:0 0 52px}
.bar-h.win .bfill{background:var(--good)}
canvas.block{display:block;width:100%;border:1px solid var(--wire);border-radius:10px;background:var(--surface)}
.tag-chip{display:inline-block;font-family:"JetBrains Mono","Noto Sans SC","Noto Sans Arabic",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);border:1px solid var(--accent-bright);border-radius:999px;padding:2px 10px}
/* ---------- exercises ---------- */
.ex-intro{color:var(--muted);font-size:14.5px;max-width:64ch;margin-bottom:16px}
.ex-card{border:1px solid var(--wire);border-radius:13px;background:var(--surface);padding:16px 18px;margin-bottom:14px;max-width:66ch}
.ex-q{font-weight:600;line-height:1.5;margin-bottom:10px}
.ex-q .qn{color:var(--accent);font-size:13px;margin-right:8px}
.ex-ta{width:100%;min-height:88px;resize:vertical;border:1px solid var(--wire);border-radius:10px;background:var(--bg);
  color:var(--ink);font:15px/1.55 "Golos Text","Noto Sans SC","Noto Sans Arabic",system-ui,sans-serif;padding:10px 12px;margin-bottom:10px}
.ex-ta:focus{outline:2px solid var(--accent-bright);outline-offset:1px}
.ex-ref{display:none;margin-top:10px;font-size:14.5px;line-height:1.6;border-inline-start:3px solid var(--accent-bright);
  background:var(--accent-soft);border-radius:10px;padding:11px 14px}
.ex-ref.show{display:block}
.ex-grade{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.ex-grade.show{display:flex}
.ex-gl{font-size:13px;color:var(--muted)}
.ex-gb{border:1px solid var(--wire);border-radius:999px;padding:6px 13px;font-size:13px;background:var(--surface)}
.ex-gb:hover{border-color:var(--accent-bright)}
.ex-gb.on{background:var(--accent-soft);border-color:var(--accent-bright);color:var(--accent);font-weight:600}
/* ---------- review ---------- */
.review-count{margin:6px 0 18px;font-size:15px}
.rev-list{display:flex;flex-direction:column;gap:9px}
.rev-row{display:flex;align-items:center;gap:13px;border:1px solid var(--wire);border-radius:12px;background:var(--surface);
  padding:12px 16px;flex-wrap:wrap}
.rev-row.off{opacity:.55}
.rev-row .num{color:var(--muted);font-size:12px}
.rev-title{font-weight:600;font-size:15px;flex:1;min-width:180px}
.rev-st{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.rev-st.ok{color:var(--good)}
/* ---------- transfer modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(20,22,26,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px}
.ovl-panel{background:var(--surface);border:1px solid var(--wire);border-radius:16px;box-shadow:var(--shadow);
  max-width:560px;width:100%;padding:22px 24px}
.ovl-panel h3{font-family:"Unbounded","Noto Sans SC","Noto Sans Arabic",sans-serif;font-weight:500;font-size:17px;margin-bottom:8px}
.ovl-panel p{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.ovl-ta{width:100%;min-height:130px;resize:vertical;border:1px solid var(--wire);border-radius:10px;background:var(--bg);
  color:var(--ink);font:12px/1.5 "JetBrains Mono",monospace;padding:10px}
.ovl-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.ovl-err{color:var(--bad);font-size:13px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div id="topbar">
  <button class="burger" id="burger" aria-label="Оглавление">☰ Оглавление</button>
  <span class="logo-name">Внутри нейросети</span>
</div>
<div id="scrim"></div>
<div id="app">
  <aside id="side">
    <div class="side-head">
      <button class="logo" id="logoBtn" title="На главную">
        <svg class="logo-mark" viewBox="0 0 38 38" aria-hidden="true">
          <g fill="none" stroke="var(--accent-bright)" stroke-width="1.4" opacity=".85">
            <line x1="8" y1="10" x2="19" y2="19"/><line x1="8" y1="28" x2="19" y2="19"/>
            <line x1="19" y1="19" x2="30" y2="12"/><line x1="19" y1="19" x2="30" y2="26"/>
          </g>
          <circle cx="8" cy="10" r="3.4" fill="var(--accent-bright)"/>
          <circle cx="8" cy="28" r="3.4" fill="var(--accent-bright)"/>
          <circle cx="19" cy="19" r="4.2" fill="var(--ink)"/>
          <circle cx="30" cy="12" r="3.4" fill="var(--accent-bright)"/>
          <circle cx="30" cy="26" r="3.4" fill="var(--accent-bright)"/>
        </svg>
        <span class="logo-name">Внутри<br>нейросети</span>
      </button>
    </div>
    <div class="lang-row" id="langRow"></div>
    <div class="side-progress"><div class="bar"><i id="pbar" style="width:0%"></i></div><b id="ppct">0%</b></div>
    <nav class="toc" id="toc"></nav>
    <div class="side-foot">
      <button id="expBtn">Сохранить прогресс в файл</button>
      <button id="impBtn">Загрузить прогресс из файла</button>
      <button id="unlockBtn"></button>
      <button id="resetBtn">Сбросить прогресс</button>
    </div>
  </aside>
  <main id="main"><div class="wrap" id="content"></div></main>
</div>

<script>
"use strict";
document.documentElement.lang = "ru";
const $ = s => document.querySelector(s);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag, cls, html){ const n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

      "html": "<p>Вспомните, как вы решаете, идти ли вечером гулять. В голове крутится несколько факторов: на улице солнечно — это «за». Накрапывает дождь — это «против». Настроение хорошее — скорее «за». Вы не считаете это в столбик, но происходит что-то очень похожее на взвешивание: каждый фактор ложится на чашу весов, и у каждого — своя «гирька», своя сила влияния.</p><p>Причём гирьки у всех разные. Для одного человека дождь — катастрофа, перечёркивающая любое солнце. Для другого — милый повод надеть плащ. Факты одинаковые, а решения разные, потому что различается <strong>вес</strong> каждого факта.</p><p>Искусственный нейрон (artificial neuron) — это ровно такая машинка для взвешивания, только предельно честная и простая. Он принимает несколько чисел на вход, умножает каждое на свою гирьку, складывает результаты и по итоговой сумме выдаёт решение. Всё. Никакой магии, никакого «понимания» — четыре арифметических действия.</p><p>Звучит слишком просто для технологии, на которой работают ChatGPT и Claude? Так и есть: один нейрон умеет очень мало. Но к концу модуля мы увидим, как из миллиардов таких простых взвешиваний, поставленных друг на друга слоями, складывается система, которая пишет тексты и находит кошек на фото. А пока — соберём один нейрон своими руками.</p>"
    },
    {
      "heading": "Из чего сделан нейрон",
      "html": "<p>У нейрона три детали, и все три вы уже интуитивно знаете.</p><p><strong>Входы (inputs)</strong> — числа, описывающие ситуацию. Нейрон не понимает слов «пасмурно» или «хандра», поэтому всё переводится в числа. Договоримся оценивать факторы по шкале от 0 до 10: солнце — 7 (довольно ясно), дождь — 2 (лёгкая морось), настроение — 6 (неплохое).</p><p><strong>Веса (weights)</strong> — те самые гирьки, по одной на каждый вход. Вес — тоже число, и в нём зашиты две вещи. Знак говорит, «за» этот фактор или «против»: положительный вес подталкивает к прогулке, отрицательный — удерживает дома. Величина говорит, насколько сильно. Возьмём такого персонажа: солнце ему приятно, но не критично — вес +0,8; дождь он терпеть не может — вес −2; настроение слегка помогает — вес +0,5. Заметьте: дождь с весом −2 влияет на решение в два с половиной раза сильнее солнца с весом +0,8. Веса — это характер нашего нейрона.</p><p><strong>Смещение (bias)</strong> — стартовое положение чаши весов, ещё до всяких входов. Наш персонаж — домосед: даже при нейтральной погоде ему лениво выходить. Вот эта лень в виде числа: смещение −3. Оно просто прибавляется к общей сумме и сдвигает точку отсчёта. У лёгкого на подъём человека смещение было бы положительным: его выманит на улицу что угодно.</p><p>Кстати, заметьте приём: мы только что перевели в числа и погоду, и настроение, и даже лень. Это вообще главный фокус всей области — нейросеть работает только с числами, поэтому всё на свете (слова, картинки, звук) сначала превращают в числа. Как это делают со словами, разберём в модуле про токены и эмбеддинги.</p><p>Итого: три входа приходят снаружи, а собственных чисел у нейрона четыре — три веса и смещение. Осталось всё перемножить и сложить.</p>"
    },
    {
      "heading": "Считаем: сумма, порог, решение",
      "html": "<p>Вот единственная формула этого модуля — в ней работа нейрона целиком:</p><p><strong>решение = f(x₁·w₁ + x₂·w₂ + x₃·w₃ + b)</strong></p><p>Расшифруем каждый символ: x₁, x₂, x₃ — входы (наши солнце, дождь и настроение); w₁, w₂, w₃ — веса, гирьки при каждом входе; точка · — обычное умножение; b — смещение, стартовый сдвиг; f — функция активации (activation function), о ней через минуту. То, что в скобках, называется взвешенной суммой (weighted sum): каждый вход берётся не сам по себе, а помноженным на свой вес.</p><div class=\"example\"><p>Считаем для нашего домоседа:</p><ul><li>солнце: 7 · 0,8 = 5,6</li><li>дождь: 2 · (−2) = −4</li><li>настроение: 6 · 0,5 = 3</li><li>смещение: −3</li></ul><p>Сумма: 5,6 − 4 + 3 − 3 = <strong>1,6</strong>. Порог договоримся считать нулём: сумма больше нуля — идём гулять. 1,6 больше нуля, значит — гулять!</p></div><p>А теперь смотрите, как решение зависит от обстоятельств. Пусть морось превратилась в ливень: вход «дождь» вырос с 2 до 8. Пересчитываем: 5,6 − 16 + 3 − 3 = −10,4. Сумма рухнула глубоко ниже нуля — сидим дома, и никакое солнце не спасёт. Один вход с большой гирькой легко перевешивает все остальные.</p><p>Здесь стоит разглядеть важную разницу. Входы меняются каждый день: сегодня солнце на семёрку, завтра на двойку. А веса и смещение остаются при нейроне — это его устойчивый «характер», его выученный опыт. Одна и та же погода, поданная нейронам с разными весами, даст разные решения. Запомните это разделение: <em>входы — про сегодняшнюю ситуацию, веса — про накопленный опыт</em>. Именно веса и есть то, что сеть приобретает при обучении.</p><p>Осталась буква f — функция активации. В нашем примере она проще некуда: «сумма больше нуля — выдай 1 (иду), иначе — 0 (остаюсь)». Такой резкий рубильник называют пороговой функцией. В настоящих сетях чаще берут плавные варианты. Сигмоида (sigmoid) превращает любую сумму в число от 0 до 1 — что-то вроде степени уверенности: не «иду / не иду», а «иду с уверенностью 0,83». Популярна и совсем простая ReLU: отрицательную сумму она обнуляет, положительную пропускает как есть. Смысл у всех один: превратить сырую сумму в аккуратный сигнал, который удобно передать дальше. Кому дальше? Вот это самый интересный вопрос.</p>"
    },
    {
      "heading": "Слои: от точек до кошки",
      "html": "<p>Один нейрон умеет провести одну границу: «сумма больше порога — да, меньше — нет». Для решения про прогулку хватает. Но чтобы отличить кошку от собаки на фотографии, одной границы мало — нужно много нейронов, работающих вместе.</p><p>Собирают их так: <strong>выходы одних нейронов становятся входами других</strong>. Нейроны выстраивают в слои (layers): первый слой получает сырые данные, второй — результаты первого, третий — результаты второго, и так далее. Сеть из многих слоёв называют глубокой — отсюда и термин «глубокое обучение» (deep learning).</p><p>Самое красивое здесь — как с каждым слоем растёт уровень абстракции. Возьмём сеть, которая ищет кошек на фото. Входы первого слоя — просто яркости пикселей, сотни тысяч чисел. Нейроны первого слоя учатся замечать элементарное: тёмную точку рядом со светлой, короткий штрих. Второй слой комбинирует штрихи в линии, углы, дуги. Третий складывает из линий формы: треугольник уха, миндалину глаза, дугу спины. А где-то в глубине сидит нейрон, чья взвешенная сумма зашкаливает, когда «уши», «усы» и «глаза» сработали одновременно, — по сути, детектор кошки. Точки → линии → формы → «кошка»: каждый следующий этаж мыслит более крупными категориями, хотя каждый отдельный нейрон по-прежнему всего лишь умножает и складывает.</p><p>Важно: никто не программировал «детектор уха». Инженеры задали только конструкцию — сколько слоёв, сколько в них нейронов. А что именно замечает каждый нейрон, определилось само, значениями весов, во время обучения.</p><p>Слово «нейрон» здесь, конечно, позаимствовано у биологов, и идея правда похожа: живой нейрон собирает сигналы от соседей через отростки-дендриты, и если суммарное возбуждение переваливает порог — выстреливает импульсом дальше по аксону. Но настоящая нервная клетка — сложнейшая химическая фабрика, а не сумматор с порогом. Аналогия вдохновляющая, но условная: мозг мы до конца так и не поняли, а нейросети понимаем, потому что сами их собрали.</p>"
    },
    {
      "heading": "Внутри — только числа",
      "html": "<p>Теперь главный вывод, ради которого всё считалось. Наш нейрон-домосед полностью описывается четырьмя собственными числами: три веса и смещение. Поменяйте их — поменяется «характер»: любитель дождя, лёгкий на подъём оптимист, безнадёжный затворник. Ничего, кроме этих чисел, у нейрона нет.</p><p>С большими сетями та же история, только масштаб другой. Веса и смещения всех нейронов вместе называют параметрами (parameters). В маленькой сети, читающей рукописные цифры, — десятки тысяч параметров. В современных языковых моделях вроде тех, что стоят за ChatGPT и Claude, — сотни миллиардов. Чтобы почувствовать масштаб: если печатать по одному такому числу в строку, получится библиотека в миллионы толстых томов, забитых сплошными дробями вроде 0,0031 и −1,74. Скачивая языковую модель на компьютер, вы скачиваете именно это — гигантский файл с числами, и ничего кроме.</p><div class=\"callout\"><p><strong>Все «знания» нейросети — это значения её весов. Огромная таблица чисел — и ничего больше.</strong> Внутри нет базы фактов, нет сохранённых текстов, нет правил грамматики. Когда модель «знает», что Париж — столица Франции, это знание не лежит в отдельной ячейке — оно размазано по миллионам весов, каждый из которых чуть-чуть подталкивает сеть к нужному ответу.</p></div><p>Отсюда неизбежный вопрос. Свои четыре числа мы подобрали вручную, из головы. Но никакой человек не подберёт вручную сотни миллиардов. Как сеть находит нужные веса сама? Это и есть обучение — тема следующего модуля. А пока закрепим сегодняшнее — руками.</p>"

    {
      "heading": "Сначала — уверенная чушь",
      "html": "<p>Представьте новорождённую нейросеть — например, ту самую, которую вы будете обучать в финале курса распознавать рукописные цифры. У неё уже есть всё из прошлого модуля: нейроны, связи между ними и веса — те самые «гирьки», которые решают, какой входной сигнал важен, а какой нет. Проблема одна: в момент рождения все гирьки расставлены <em>случайно</em>.</p><p>Что выдаёт такая сеть? Уверенную чушь. Показываете ей аккуратно выведенную семёрку — она отвечает «два». Показываете ноль — «шесть». Это как рояль, струны которого натянули наугад: клавиши нажимаются, звук идёт, но вместо музыки — грохот.</p><p>Здесь важно уловить главный сдвиг в мышлении. Никто не сядет прописывать правила вида «семёрка — это горизонтальная палочка сверху и косая линия вниз». Так пытались делать в раннем искусственном интеллекте — и тонули в исключениях: у одного семёрка с перекладиной, у другого с хвостиком, у третьего завалена набок. Вместо этого сеть будет <strong>настраиваться сама</strong> — методом, до смешного похожим на игру «холодно — горячо»: попробовала, ошиблась, чуть подкрутила гирьки, попробовала снова. Миллионы раз.</p><p>Чтобы это заработало, нужно ответить на два вопроса. Первый: как измерить «ошиблась» — чтобы это было не смутное ощущение, а конкретное число? Второй: как понять, <em>какие именно</em> гирьки крутить и в какую сторону, если их тысячи или миллиарды? Весь этот модуль — про ответы на эти два вопроса.</p>"

    {
      "heading": "Градусник неправильности",
      "html": "<p>Чтобы что-то улучшать, надо сначала научиться это измерять. Для этого есть <strong>функция ошибки</strong> (loss function, или просто loss) — способ свести всю «неправильность» сети к одному числу. Чем хуже сеть отвечает, тем число больше. Отвечает идеально — ноль.</p><div class=\"example\"><p>Сеть смотрит на картинку с семёркой и выдаёт уверенность по каждой цифре: «единица — 60%, семёрка — 10%, четвёрка — 8%…» Правильный ответ — семёрка, а сеть дала ей жалкие 10%. Функция ошибки сравнивает это с идеалом («семёрка — 100%, остальное — 0%») и выносит вердикт: скажем, 2,3. После обучения на той же картинке сеть скажет «семёрка — 95%», и ошибка упадёт до 0,05.</p></div><p>Считают ошибку не по одной картинке: её усредняют по тысячам обучающих примеров и получают одно итоговое число — среднюю температуру по больнице. Это и есть «градусник неправильности» всей сети целиком. Во время обучения на него смотрят постоянно: ползёт вниз — сеть умнеет, застыл или растёт — что-то пошло не так.</p><p>Зачем такие сложности? Затем, что число — это то, что можно <em>уменьшать</em>. Задача «сделай сеть умнее» не даёт никакой зацепки. Задача «найди значения весов, при которых вот это число минимально» — уже чёткая, механическая, решаемая.</p><div class=\"callout\"><p><strong>Обучение нейросети — это не магия и не «объяснение материала». Это поиск такого набора весов, при котором функция ошибки показывает минимум.</strong> Всё остальное в модуле — про то, как именно устроен этот поиск.</p></div>"
    },
    {
      "heading": "Спуск с горы в густом тумане",
      "html": "<p>Представьте на минуту, что у сети всего два веса. Тогда можно нарисовать карту: вправо-влево откладываем первый вес, вперёд-назад — второй, а высота в каждой точке — величина ошибки при таком сочетании весов. Получится ландшафт: холмы (плохие сочетания), долины (хорошие) и где-то — самая глубокая точка, те самые идеальные веса.</p><p>Почему бы просто не осмотреть всю карту и не найти минимум? Потому что даже у крошечной сети из финальной игры весов около десяти тысяч, и карта получается не двумерная, а десятитысячемерная. Перебрать все комбинации не успеет ни один компьютер до конца существования Вселенной. Так что всю карту мы не видим. Мы стоим в одной её точке — это текущие, пока случайные, веса — и вокруг густой туман.</p><p>Но кое-что сделать можно: пощупать наклон под ногами. Для каждого веса можно выяснить: если его чуть-чуть увеличить, ошибка подрастёт или упадёт? И насколько резко? Это локальный наклон в текущей точке. Дальше стратегия проста, как настоящий спуск с горы в тумане: чувствуете, в какую сторону склон уходит вниз, — делаете маленький шаг туда. Снова щупаете наклон, снова шаг. И так тысячи раз, пока не окажетесь на дне долины, где вниз двигаться уже некуда.</p><p>Этот метод называется <strong>градиентный спуск</strong> (gradient descent). «Градиент» — просто математическое слово для направления самого крутого наклона. Практически всё современное машинное обучение — от распознавалки цифр до ChatGPT и Claude — в своей основе спускается с горы именно так.</p>"
    },
    {
      "heading": "Размер шага решает всё",
      "html": "<p>В спуске с горы есть один настраиваемый параметр, и он на удивление капризный: длина шага. В машинном обучении её называют <strong>скорость обучения</strong> (learning rate). Это единственная формула модуля, и вот она:</p><p><em>новый вес = старый вес − скорость обучения × наклон</em></p><p>Расшифруем каждое слово. <strong>Старый вес</strong> — текущее значение гирьки. <strong>Наклон</strong> — число, показывающее, куда и насколько круто меняется ошибка, если эту гирьку чуть сдвинуть. <strong>Скорость обучения</strong> — множитель, размер шага. А минус стоит потому, что идём мы против наклона: не в гору, а вниз.</p><div class=\"example\"><p>Пусть вес равен 0,50, наклон в этой точке равен 2 (ошибка растёт, если вес увеличивать), а скорость обучения — 0,1. Новый вес: 0,50 − 0,1 × 2 = 0,30. Один шаг сделан — вес сдвинулся на 0,2 в сторону меньшей ошибки.</p></div><p>Теперь почему это капризно. Слишком маленький шаг — скажем, 0,0001 — и спуск превращается в вечность: тысячи шагов, чтобы сползти с одного пригорка. Вдобавок легко застрять в первой попавшейся ямке — <strong>локальном минимуме</strong> (local minimum). Это неглубокая вмятина на склоне: мелкими шажками из неё не выбраться, хотя настоящая долина — дальше и ниже. Слишком большой шаг — беда противоположная: вы перемахиваете долину насквозь и приземляетесь на противоположном склоне, потом обратно, и снова, и снова. Ошибка не убывает, а скачет, а то и растёт. На практике скорость подбирают экспериментально и часто меняют по ходу: в начале обучения — смелые шаги, ближе к долине — осторожные.</p>"

    {
      "heading": "Кто виноват: обратное распространение ошибки",
      "html": "<p>Остался вопрос на миллиард. Для каждого веса нужно знать наклон: «подкрутим эту гирьку — ошибка вырастет или упадёт?» Но весов в больших языковых моделях миллиарды. Наивный способ — сдвинуть один вес, прогнать все примеры, посмотреть на ошибку, вернуть вес на место, взять следующий — потребовал бы миллиардов полных прогонов ради одного-единственного шага вниз. Так не спуститься никогда.</p><p>Спасение называется <strong>обратное распространение ошибки</strong> (backpropagation). Идея, без единой формулы, такая: когда сеть выдала ответ и мы посчитали ошибку, эту ошибку можно прогнать по сети задом наперёд — от выхода ко входу. Проходя назад через слои, она раздаёт каждому весу его долю вины: «ты завысил сигнал, из-за тебя ответ уехал не туда — тебе на уменьшение», «а ты задавил полезный сигнал — тебе на увеличение».</p><p>Аналогия: ресторан получил разгромный отзыв. Глупый управляющий менял бы сотрудников по одному и после каждой замены месяц ждал новых отзывов. Умный разбирает цепочку событий в обратном порядке: гость недоволен десертом → десерт делал кондитер → крем расслоился, потому что сливки были тёплые → сливки не убрал в холодильник стажёр. Один разбор — и каждому в цепочке ясно, что именно менять и насколько.</p><p>Красота backpropagation в том, что вся «раздача вины» происходит за один обратный проход — по затратам это примерно как ещё раз пропустить пример через сеть. Придумали этот трюк ещё в 1980-х, и до сих пор он — сердце обучения любой нейросети, включая самые большие языковые модели.</p>"

    {
      "heading": "Миллиарды умножений: зачем нужны видеокарты",
      "html": "<p>Соберём полный цикл: показали сети порцию примеров → посчитали ошибку → обратным проходом выяснили вину каждого веса → сдвинули все веса на шажок вниз. Один цикл делает сеть лучше лишь чуть-чуть, поэтому циклов нужны тысячи и миллионы. Один полный проход по всем обучающим примерам называется <strong>эпохой</strong> (epoch); даже маленькие сети гоняют десятки эпох, показывая им одни и те же примеры снова и снова.</p><p>Отсюда два знаменитых аппетита нейросетей. Первый — данные. Наклон, оценённый по паре примеров, шумный и дёрганый: сеть, увидевшая три семёрки, решит, что семёрка — это «что-то с косой палочкой», и будет путать её с единицей. Чтобы шаги вели в правильную сторону, распознавалке цифр нужны десятки тысяч картинок, а языковой модели — триллионы слов. Второй аппетит — вычисления. Внутри каждого прохода крутятся умножения «сигнал × вес», и при миллиардах весов счёт операций идёт на миллиарды за каждый шаг.</p><p>И тут выясняется забавное. Обычный процессор (CPU) — как гениальный курьер: выполнит любую задачу, но за раз везёт одну посылку. А <strong>видеокарта</strong> (GPU, graphics processing unit) создавалась для игр — одновременно пересчитывать миллионы пикселей. По сути это несколько тысяч простеньких калькуляторов, работающих параллельно. Обучение сети — как раз миллиарды одинаковых независимых умножений, идеальная работа для GPU: то, что процессор перемалывал бы месяцами, видеокарта делает за часы. Именно поэтому обучение больших моделей стоит миллионы долларов и требует целых залов с видеокартами — к этим масштабам вернёмся в модуле про предобучение.</p><p>А прежде чем сеть сможет учиться на текстах, тексты нужно превратить в числа. Этим займёмся в следующем модуле.</p>"

      "heading": "Попробуйте сами",

      "heading": "Главное",

    {
      "heading": "Компьютер не понимает слов",
      "html": "<p>Вспомните нейрон из второго модуля: он берёт входные числа, умножает их на веса и складывает. Вся нейросеть — гигантский конвейер умножений и сложений. Числа на входе — обязательное условие: букву «к» невозможно умножить на вес 0,3.</p><p>С картинками этот фокус проходит легко: изображение и так состоит из пикселей, а каждый пиксель — это яркость, число от 0 до 255. Со звуком тоже: громкость волны в каждый момент времени. А язык? Слово «кошка» — не число и само в числа не превращается.</p><p>Первое, что приходит в голову, — пронумеровать словарь: «а» — 1, «абажур» — 2, и так далее, «кошка» — 7215, «собака» — 41 892. Технически работает, но номера случайны: у «кошки» и «карбюратора» могут оказаться соседние числа, а «кошка» и «кот» — в разных концах списка. Для сети, которая живёт умножением чисел, это катастрофа: близость номеров ничего не говорит о близости смысла, и учиться на таких числах почти невозможно.</p><p>Поэтому перевод языка в числа делают в два шага. Сначала текст режут на стандартные кусочки — <strong>токены</strong>. Потом каждому токену выдают не один номер, а целый набор чисел, в котором закодирован смысл, — <strong>эмбеддинг</strong>. Разберём оба шага по порядку.</p>"
    },
    {
      "heading": "Токены: текст режут на кусочки",
      "html": "<p>Токен (token) — это единица, которой модель видит текст. Иногда токен — целое слово, чаще — кусок слова, иногда — знак препинания или пробел, приклеенный к началу слова. Специальная программа — токенизатор (tokenizer) — режет любой текст на такие кусочки по заранее составленному словарю (vocabulary).</p><div class=\"example\"><p>Фраза «Пёс запрыгнул на подоконник» может превратиться примерно в такой набор: <em>«Пёс», « за», «прыг», «нул», « на», « под», «окон», «ник»</em> — восемь токенов. Частое словечко «на» — один токен, а редкий «подоконник» собирается из трёх кусочков. У каждого токена есть номер в словаре: скажем, «Пёс» — 21 407, « на» — 512.</p></div><p>Казалось бы, проще резать по целым словам. Но словарь целых слов невозможно закончить:</p><ul><li><strong>Формы слов.</strong> «Кот, кота, коту, котом, о котах» — для такого словаря это пять разных записей, и так с каждым существительным и глаголом. Русский язык раздул бы словарь до миллионов позиций.</li><li><strong>Новые слова и имена.</strong> «Зумер», «нейросетка», фамилия вашего коллеги — их в словаре не было, и модель встала бы в тупик на «незнакомом слове».</li><li><strong>Опечатки.</strong> «Превет» — не слово из словаря, но человек его спокойно читает. Модель тоже должна.</li></ul><p>А почему не резать по буквам? Букв всего тридцать три плюс знаки — словарь крошечный, любой текст точно разрежется. Но тогда последовательность станет в пять-шесть раз длиннее, а каждый кусочек — бессмысленным: буква «к» сама по себе не значит ничего. Сеть тратила бы все силы на то, чтобы заново собирать из букв слова.</p><p>Токены — компромисс между этими крайностями: словарь конечный (обычно 50–150 тысяч кусочков), частые слова остаются целыми, а редкие и незнакомые собираются из частей, как из деталей конструктора. Любой текст — хоть с опечатками, хоть со свежепридуманными словами — гарантированно нарезается без остатка.</p><div class=\"callout\"><p>Модель никогда не видит букв — только номера токенов. Поэтому LLM может ошибиться, считая буквы «р» в слове «параллелограмм»: для неё это не цепочка из четырнадцати букв, а два-три токена — неделимых кусочка.</p></div>"
    },
    {
      "heading": "Эмбеддинг: координаты смысла",
      "html": "<p>Итак, текст стал цепочкой номеров токенов. Но номер — всё ещё случайная бирка. Второй шаг: каждому токену сопоставляют <strong>эмбеддинг</strong> (embedding) — вектор (vector), то есть попросту список из сотен или тысяч чисел. В небольших моделях — по 300–700 чисел на токен, в современных LLM — несколько тысяч.</p><p>Представьте, что слово описывают анкетой из сотен шкал: «живое — неживое», «большое — маленькое», «приятное — неприятное», «домашнее — дикое»… Каждое число эмбеддинга — положение на одной такой шкале.</p><div class=\"example\"><p>Игрушечный пример. «Кот» — [0,82; −0,15; 0,90; …]: высоко по шкале «живое», заметно по шкале «домашнее». «Трактор» — [−0,74; 0,88; −0,05; …]: неживое, большое. Всего таких чисел не три, а, скажем, пятьсот — и вместе они задают точку: где именно «живёт» это слово в пространстве из пятисот измерений.</p></div><p>Важный подвох: в настоящих моделях шкалы никто не подписывал. Там нет графы «пушистость» — есть шкала № 217, смысл которой не знает никто, включая создателей модели. Исследователи иногда находят направления, похожие на человеческие признаки, но в целом это координаты в пространстве, устроенном не по-нашему.</p><p>Зато с координатами работает вся привычная геометрия. Вообразить пространство из тысяч измерений мы не можем — и не надо: правила там те же, что на плоскости, просто чисел-координат больше. Главное — между точками можно измерять расстояния. И вот тут начинается самое интересное.</p>"
    },
    {
      "heading": "Близкие смыслы — близкие точки",
      "html": "<p>Главное свойство хорошо обученных эмбеддингов: <strong>близкие по смыслу слова — это близкие точки</strong>. «Кот» окажется рядом с «кошкой» и «псом», неподалёку — «мышь» и «ветеринар», а «бухгалтерия» — в другом конце пространства.</p><p>Причём близость именно по смыслу, а не по написанию. «Кот» и «код» отличаются одной буквой, но живут далеко друг от друга: один — среди животных, другой — среди программирования и шифров.</p><p>Слова собираются в районы: квартал животных, квартал еды, квартал стран, квартал эмоций. А поскольку измерений сотни, одно слово может быть близко сразу к нескольким районам: «врач» соседствует и с профессиями («учитель», «инженер»), и с медициной («больница», «лечить»). На плоской карте так не получится, а в сотнях измерений — легко.</p><p>Остаётся вопрос: что делать с многозначными словами? «Лук» — это и овощ, и оружие, а точка у токена одна — она повисает где-то между грядкой и арсеналом. Разводить смыслы по контексту будет механизм внимания — про эту суперспособность трансформера следующий модуль.</p>"
    },
    {
      "heading": "Арифметика со смыслами",
      "html": "<p>Раз слова — точки с координатами, с ними можно делать арифметику: складывать и вычитать векторы, число за числом. В 2013 году на модели word2vec обнаружили знаменитый эффект:</p><p><strong>вектор(«король») − вектор(«мужчина») + вектор(«женщина») ≈ вектор(«королева»)</strong></p><p>Расшифруем: берём координаты слова «король», вычитаем из них координаты слова «мужчина» (каждое число из соответствующего числа), прибавляем координаты слова «женщина» — и получившаяся точка оказывается ближе всего к слову «королева». Знак ≈ означает «примерно равно»: попадаем не в саму точку, а рядом с ней.</p><p>Почему это работает? Разность «король минус мужчина» — это стрелка, в которой осталось «королевское без мужского»: власть, трон, корона. Прибавили «женщину» — получили «власть плюс женский пол». Удивительно другое: направление «из мужского в женское» в пространстве примерно одно и то же для разных пар слов. Одна и та же стрелка ведёт от «короля» к «королеве», от «актёра» к «актрисе», от «быка» к «корове».</p><div class=\"example\"><p>Другие стрелки: возьмите «Париж», вычтите «Францию», прибавьте «Японию» — окажетесь возле «Токио»: это направление «страна → столица». А стрелка от «идти» к «шёл» — направление прошедшего времени: приложите её к «плыть» — попадёте в «плыл». Смысловые отношения превратились в геометрию.</p></div><p>Честная оговорка: работает это приблизительно и не на любых парах — на редких словах стрелки промахиваются. Но сам факт поразителен: пол, столицы, время глагола — всё это стало направлениями в пространстве, с которыми можно обращаться как со стрелками на карте.</p>"
    },
    {
      "heading": "Кто расставил слова по местам?",
      "html": "<p>Самое время спросить: кто вписал все эти числа? Сотни координат на каждый из ста тысяч токенов — десятки миллионов чисел только на входе модели. Ответ: никто. Ни один лингвист не размечал, что «кот» домашний, а «трактор» большой.</p><p>Эмбеддинги — такие же настраиваемые веса сети, как гирьки из третьего модуля. В начале обучения это случайные числа: «кот» и «бухгалтерия» стоят где попало. Дальше — знакомый вам цикл: сеть пытается предсказать следующий токен, ошибается, и градиентный спуск чуть-чуть подкручивает все веса — включая координаты каждого слова.</p><p>Почему слова постепенно съезжаются в осмысленную карту? Потому что так удобнее предсказывать. «Кот» и «кошка» встречаются в почти одинаковых окружениях: «… лакает молоко», «… мурлычет на диване». Если их точки стоят рядом, всё, что сеть выучила про продолжения фраз с «котом», автоматически работает и для «кошки» — предсказания точнее, ошибка меньше. И градиент миллионы раз подталкивает похожие по употреблению слова друг к другу, а непохожие растаскивает. Карта смыслов складывается сама.</p><div class=\"callout\"><p>Смысловая карта — не задумка инженеров, а побочный продукт одной монотонной задачи: предсказывать следующий токен чуть лучше. Оказалось, что для этого выгоднее всего расставить слова по смыслу.</p></div><p>Лингвисты называют это дистрибутивной гипотезой — «скажи мне, среди каких слов ты ходишь, и я скажу, что ты значишь». Значение выучивается из окружений, без словарей и учителей. Именно поэтому в шестом модуле, где модель будет читать «весь интернет», ей хватит просто текстов — гигантской кучи сырых текстов.</p>"
    },
    {
      "heading": "Попробуйте сами",
      "html": "<p>Ниже — карта слов: сотни измерений спроецированы на плоскость, чтобы мы могли их разглядеть. Пощёлкайте по разным словам и посмотрите, кого карта считает ближайшими соседями: животные жмутся к животным, еда — к еде. Затем нажмите кнопку «король − мужчина + женщина» и проследите за стрелками — это та самая векторная арифметика в действии. Обратите внимание: стрелка «из мужского в женское» приводит в правильную точку, хотя никто не объяснял модели, что такое пол.</p>"

    {
      "heading": "Главное",
      "html": "<ul><li>Нейросеть умеет работать только с числами, поэтому текст переводят в числа в два шага: сначала токены, потом эмбеддинги.</li><li>Токен — стандартный кусочек текста, чаще всего часть слова. Целые слова не годятся: словарь никогда не закончится из-за форм слов, новых слов и опечаток. Отдельные буквы тоже: текст становится длинным, а кусочки — бессмысленными.</li><li>Модель видит номера токенов, а не буквы — отсюда её знаменитые провалы в подсчёте букв.</li><li>Эмбеддинг — вектор из сотен чисел, «координаты смысла» токена в многомерном пространстве. Каждое число — шкала какого-то признака, но эти шкалы никто не подписывал.</li><li>Близкие по смыслу слова — близкие точки: «кот» рядом с «кошкой» и «псом», далеко от «бухгалтерии». А отношения между смыслами — направления: одна и та же стрелка «из мужского в женское» ведёт от «короля» к «королеве» и от «актёра» к «актрисе».</li><li>Координаты никто не задаёт вручную: сеть выучивает их сама градиентным спуском, потому что осмысленная карта слов помогает точнее предсказывать следующий токен.</li></ul>"

{

    {
      "heading": "Слова-хамелеоны и потерянная кошка",
      "html": "<p>В прошлом модуле слова превратились в эмбеддинги — списки чисел, в которых похожие по смыслу слова оказываются рядом. Но есть загвоздка: у слова «ключ» одна запись в словаре модели, а смыслов минимум три. «Я потерял ключ от квартиры» — железка для замка. «Мы набрали воды из ключа на опушке» — родник. «Нашёлся ключ к шифру» — разгадка. Само по себе слово не значит почти ничего: смысл каждый раз собирается из соседей.</p><p>С местоимениями ещё хуже. «Она» — вообще пустая оболочка: вся начинка приходит из контекста. Вернёмся к нашей кошке: «Кошка не стала есть рыбу, потому что она была несвежей». Чтобы понять «она», нужно дотянуться до слова «рыбу» — а оно стоит на пять слов раньше. Замените «несвежей» на «сытой» — и та же самая «она» внезапно окажется кошкой. Одно слово в конце фразы перевернуло смысл слова в середине: вот с чем приходится иметь дело модели.</p><p>Теперь вспомните цепь Маркова из первого модуля. Она смотрит на два-три предыдущих слова, не дальше. Прямо перед «она» стоят «потому» и «что» — ноль полезной информации. Нужные подсказки — «рыбу», «кошка», «несвежей» — вне её поля зрения. А в реальных текстах слово-подсказка может стоять на три абзаца выше: «Договор, который мы обсуждали в понедельник… — подпишите его». Никакое окно из трёх, пяти или десяти слов проблему не решает: нужен механизм, который умеет заглядывать <em>куда угодно</em> в тексте.</p>"
    },
    {
      "heading": "Оглянуться на всё предложение",
      "html": "<p>Этот механизм называется <strong>внимание (attention)</strong>. Идея такая: обрабатывая очередное слово, модель просматривает <em>все</em> слова контекста и каждому назначает вес важности — число, которое показывает, насколько сильно на это слово «смотреть» прямо сейчас.</p><p>Вы делаете так постоянно. Читаете детектив, встречаете фразу «так вот чей это платок!» — и мысленно перелистываете назад, к сцене из третьей главы, пропуская сотни страниц между ними. Или стоите на шумной вечеринке: вокруг десяток разговоров, но вы «подкручиваете громкость» одного голоса и приглушаете остальные. Внимание в нейросети — та же подкрутка громкости, только для слов, и она происходит заново для каждого обрабатываемого слова.</p><p>Заметьте принципиальную разницу с цепью Маркова. Там расстояние решало всё: два слова назад — видим, четыре — уже нет. Во внимании расстояние само по себе не приговор: слово в начале книги может получить большой вес, а соседнее слово — почти нулевой. Важность определяется не близостью, а смыслом.</p><div class=\"example\"><p>Веса внимания — это доли, которые в сумме дают единицу, как проценты. Обрабатывая слово «она» в нашей фразе, модель может распределить внимание так: «рыбу» — 0.58, «несвежей» — 0.20, «кошка» — 0.09, «есть» — 0.06, остальные крохи — на прочие слова. Больше половины «взгляда» досталось рыбе — и «она» получает смысл «та самая рыба из начала фразы».</p></div><p>Важно: эти веса никто не прописывает вручную. Их на лету вычисляет сама сеть — теми же «гирьками», которые мы разбирали во втором модуле и которые настраиваются при обучении. Для каждого нового предложения раскладка внимания своя.</p><div class=\"callout\"><p><strong>Ключевая мысль:</strong> чтобы понять слово, не нужно тащить в памяти весь текст с одинаковой силой. Нужно уметь мгновенно найти те несколько слов, которые важны именно сейчас, — и смотреть в основном на них.</p></div>"
    },
    {
      "heading": "Каждое слово рассылает запрос",
      "html": "<p>Как сеть решает, куда смотреть? Без формул это удобно представить так: каждое слово рассылает всем остальным запрос — «кто тут про меня?». Слово «она» как бы объявляет: «Я местоимение женского рода единственного числа, ищу существительное, о котором недавно шла речь». А каждое слово в предложении носит своего рода бейджик с описанием: «я существительное, женский род, из мира еды». Чем лучше бейджик отвечает на запрос, тем выше вес внимания между этой парой слов. У «рыбы» совпадение отличное, у «кошки» — похуже (по роду подходит, но по смыслу фразы «несвежей» была явно не она), у слова «потому» — почти нулевое. Сила совпадения и становится весом внимания: 0.58, 0.09, почти ноль.</p><p>Дальше происходит главное: слово не просто «смотрит» на важных соседей — оно <strong>вбирает</strong> из них информацию. В эмбеддинг слова «она» подмешиваются кусочки смысла из «рыбу» и «несвежей», пропорционально весам. На выходе «она» — уже не абстрактное местоимение, а почти что «несвежая рыба из этого предложения». То же самое с «ключом»: если рядом «дверь» и «замок», его вектор сдвигается к железке; если «лес» и «струя» — к роднику. Одно и то же слово на входе — разные векторы на выходе, в зависимости от окружения. Именно так решается проблема слов-хамелеонов.</p><p>И запросы, и бейджики — это тоже просто числа, которые получаются из эмбеддингов умножением на обучаемые веса. Никто не программировал правило «местоимение ищет существительное». Модель выучила его сама, градиентным спуском из третьего модуля, — просто потому, что умение находить, к чему относится «она», помогает точнее предсказывать следующее слово.</p>"

    {
      "heading": "Десятки слоёв, сотни специалистов",
      "html": "<p>Один проход внимания ловит один «срез» связей. Но в настоящих моделях слои внимания ставят друг на друга десятками, а внутри каждого слоя параллельно работает несколько <strong>голов внимания (attention heads)</strong> — независимых механизмов, каждый со своими выученными весами. И у каждой головы складывается своя специальность: одна следит за согласованием прилагательных с существительными, другая — за тем, к чему относятся местоимения, третья связывает глагол с его дополнением, четвёртая собирает слова одной темы.</p><p>Слои работают как конвейер с нарастающей сложностью. Нижние ловят простое и локальное: соседние слова, куски грамматики. Средние собирают словосочетания и связи внутри предложения. Верхние оперируют уже почти смыслом: о чём абзац, где ирония, что из чего следует. Представьте издательство, где рукопись проходит через цепочку редакторов: корректор правит опечатки, стилист — обороты, фактчекер сверяет даты, выпускающий смотрит на текст целиком. Каждый вносит свою правку, опираясь на работу предыдущих, — и на выходе текст «понят» на всех уровнях сразу.</p><div class=\"example\"><p>Масштаб: в GPT-3 — 96 слоёв, в каждом по 96 голов внимания. Итого больше девяти тысяч маленьких «специалистов по связям», и каждый смотрит на текст по-своему.</p></div><p>Самое интересное: специализации никто не назначал. Все головы устроены одинаково и различаются только выученными весами — роли сложились сами в ходе обучения. Исследователи потом с любопытством разглядывают готовую модель и обнаруживают: вот эта голова, оказывается, отслеживает открытые кавычки, а вон та — имена персонажей.</p>"

    {
      "heading": "Трансформер: «Внимание — это всё, что нужно»",
      "html": "<p>В 2017 году инженеры Google опубликовали статью «Attention Is All You Need» — «Внимание — это всё, что вам нужно». В ней описана архитектура <strong>трансформер (transformer)</strong>: стопка слоёв внимания, перемежающихся обычными слоями нейронов из второго модуля. Название статьи оказалось пророческим — сегодня на трансформерах работают практически все большие языковые модели.</p><p>До 2017 года текстами занимались в основном рекуррентные сети (recurrent neural networks). Они читали текст строго по одному слову, таща за собой сжатый «конспект» прочитанного. К концу длинного абзаца конспект неизбежно расплывался — начало забывалось. У трансформера перед ними два решающих преимущества.</p><ul><li><strong>Весь контекст сразу.</strong> Внимание смотрит на все слова одновременно, ничего не пересказывая самому себе по цепочке. Первые трансформеры удерживали в поле зрения сотни токенов, современные модели — сотни тысяч: это толстая книга, которую модель видит «одним взглядом». Когда вы вставляете в чат длинный договор и спрашиваете про пункт из середины, работает именно это: внимание дотягивается до нужного места напрямую, без пересказа по цепочке.</li><li><strong>Параллельность.</strong> Рекуррентная сеть не может взяться за слово №500, пока не закончила с №499, — всё строго по очереди. В трансформере все слова обрабатываются одновременно, а это идеальная задача для видеокарт (GPU) с их тысячами ядер. Обучение ускорилось на порядки — и впервые стало реально прогнать через модель тексты всего интернета. Об этом — следующий модуль.</li></ul><p>Теперь можно расшифровать знакомую аббревиатуру. <strong>GPT — Generative Pretrained Transformer</strong>, «порождающий предобученный трансформер»: <em>порождающий</em> — потому что порождает текст, предсказывая следующий токен; <em>предобученный</em> — потому что сначала прочитал гигантский корпус текстов (об этом дальше); <em>трансформер</em> — та самая архитектура из слоёв внимания. Две трети названия вы уже понимаете изнутри.</p><div class=\"callout\"><p><strong>Трансформер победил не потому, что он «умнее» устроен.</strong> Он видит весь контекст сразу и отлично распараллеливается — а значит, его можно раскармливать данными и вычислениями почти без предела. Дальше в дело вступил масштаб.</p></div>"

      "heading": "Главное",
      "html": "<ul><li>Смысл слова зависит от контекста («ключ» от двери или в лесу), а слово-подсказка может стоять далеко. Цепь Маркова с её окном в два-три слова здесь бессильна.</li><li><strong>Внимание (attention)</strong> — механизм, при котором каждое слово получает веса важности всех слов контекста и вбирает информацию из самых важных. Веса — доли, в сумме дающие единицу.</li><li>Интуиция без формул: каждое слово рассылает запрос «кто тут про меня?», а совпадение запроса с «бейджиками» других слов задаёт силу внимания. Эти правила модель выучивает сама.</li><li>После прохода внимания эмбеддинг слова обновляется контекстом: «она» превращается в «ту самую рыбу», «ключ» — в железку или родник.</li><li>Слоёв и голов внимания — десятки и сотни, у каждой своя стихийно сложившаяся специализация: грамматика, местоимения, темы.</li><li><strong>Трансформер</strong> (статья «Attention Is All You Need», 2017) видит весь контекст сразу — сегодня это сотни тысяч токенов — и отлично параллелится на GPU.</li><li><strong>GPT</strong> — Generative Pretrained Transformer, «порождающий предобученный трансформер».</li></ul>"

    {
      "heading": "Одна задача, повторённая триллионы раз",
      "html": "<p>Предобучение (pretraining) — это этап, на котором нейросеть из бесполезной груды случайных чисел превращается в то, что умеет говорить. И устроен он до смешного просто. Берём кусок реального текста. Показываем модели начало, прячем продолжение. Просим угадать следующий токен. Сравниваем догадку с тем, что было в тексте на самом деле. Если модель ошиблась — чуть-чуть подкручиваем веса, ровно тем градиентным спуском, который вы видели в третьем модуле. И повторяем. Триллионы раз.</p><div class=\"example\"><p>Модель видит: «Мама мыла…» — и выдаёт вероятности для каждого токена словаря: «посуду» — 30%, «пол» — 20%, «раму» — 10%, и так далее. В исходном тексте дальше шло слово «раму». Значит, десять процентов — маловато: все веса, отвечавшие за эту догадку, сдвигаются на крошечный шаг так, чтобы в похожей ситуации «раму» получила больше. Одна такая поправка почти ничего не меняет. Триллион поправок меняют всё.</p></div><p>Красота этой схемы в том, что учитель не нужен. Никто не размечает данные, не пишет «правильных ответов» — правильный ответ уже лежит в самом тексте, это просто следующее слово. Поэтому такой подход называют самообучением (self-supervised learning): текст сам себе и задачник, и решебник.</p><p>А текста нужно много. В корпус (corpus) — так называют обучающую коллекцию — идёт всё, до чего можно дотянуться: веб-страницы, книги, «Википедия», научные статьи, форумы, новости и огромные объёмы программного кода с открытых репозиториев. Современные большие модели обучают примерно на 15 триллионах токенов — это порядка десяти триллионов слов.</p><p>Правда, «весь интернет» — небольшое преувеличение: сырой интернет по большей части мусор. Перед обучением корпус старательно чистят: выбрасывают дубликаты, спам, автоматически сгенерированные страницы, отсеивают тексты низкого качества. Чем чище и разнообразнее корпус, тем умнее модель на выходе, — поэтому подбор данных в лабораториях охраняют едва ли не строже, чем сам код.</p>"
    },
    {
      "heading": "Миллиарды гирек",
      "html": "<p>Что именно «подкручивается» триллионы раз? Параметры (parameters) модели — те самые веса-гирьки из второго модуля, где нейрон взвешивал входы. Только там их было три штуки, а здесь — миллиарды. У GPT-3 было 175 миллиардов параметров, у открытой Llama 3 — до 405 миллиардов, у нынешних флагманов счёт тоже идёт на сотни миллиардов.</p><div class=\"example\"><p>Попробуем представить 175 миллиардов чисел. Распечатаем их столбиком, по 50 на страницу, — получится 3,5 миллиарда страниц. Стопка бумаги толщиной по 0,1 мм на страницу вытянется на 350 километров — почти до орбиты МКС. И это просто список чисел вроде 0,231 и −1,87, без единого слова.</p></div><p>Важно понять: кроме этих чисел, у модели ничего нет. Внутри нет базы данных, нет сохранённых статей, нет поисковика по прочитанному. После обучения корпус можно стереть — модель в него больше не заглядывает. Всё, что она «знает» о мире, о языке и о вас, сжато в эти миллиарды весов.</p><p>Кстати, заметьте пропорцию: токенов в корпусе — триллионы, а параметров — «всего лишь» сотни миллиардов, в десятки раз меньше. Дословно запомнить всё прочитанное модель физически не может — не поместится. Ей приходится делать то, что делает любой студент перед экзаменом, когда конспектов больше, чем времени: не зубрить, а выводить общие закономерности. Как мы сейчас увидим, именно это ограничение и делает её умной.</p>"
    },
    {
      "heading": "Почему «угадай слово» учит всему на свете",
      "html": "<p>На первый взгляд задача выглядит убогой. Угадывать следующее слово — этому же и попугая можно научить? Марковская цепь из первого модуля примерно этим и занималась. Но есть подвох: попугай угадывает кое-как, а от модели требуется угадывать <strong>хорошо</strong> — в любом тексте мира. И вот тут выясняется, что дёшево отделаться не получится.</p><p>Посмотрите, что на самом деле нужно, чтобы уверенно продолжить разные фразы:</p><ul><li>«Столица Австралии — …» — нужны факты: правильный ответ «Канберра», хотя «Сидней» так и просится.</li><li>«Она схватила зонт, потому что за окном…» — нужны причинно-следственные связи из обычной жизни.</li><li>«Пять плюс семь равно…» — нужна арифметика.</li><li>«Убийцей оказался…» в конце детектива — нужно удержать в голове сюжет на триста страниц и сделать вывод из улик.</li><li>Продолжить программу на Python так, чтобы она работала, — нужна логика.</li><li>И в каждой фразе: «он пошёл», но «она пошла» — нужна грамматика.</li></ul><p>Каждый пробел в знаниях — это ошибка предсказания. Ошибка — это сигнал градиентному спуску: подкрути веса. И веса подкручиваются до тех пор, пока внутри не осядет то, что ошибку убирает: правило, факт, закономерность.</p><div class=\"callout\"><p><strong>Ключевая мысль курса.</strong> Никто не закладывал в модель правила русского языка, таблицу умножения или столицы государств. Они осели в весах сами — просто потому, что помогают предсказывать следующий токен. Грамматика, факты, стили, логика рассуждений — всё это побочный продукт одной примитивной задачи, повторённой триллионы раз.</p></div><p>Предсказание следующего слова оказалось экзаменом по всему сразу. Именно поэтому такая «глупая» цель дала такой неожиданно умный результат. Причём чем больше модель и чем больше текстов она видела, тем более тонкие закономерности успевают осесть в весах: маленькая сеть осваивает только грамматику и ходовые обороты, средняя начинает удерживать факты, а по-настоящему большая — связно рассуждать на несколько шагов. Никакой магии в этом переходе нет: просто у более крупной модели хватает «гирек», чтобы вместить более сложные правила.</p>"
    },
    {
      "heading": "Цена вопроса: месяцы, мегаватты, миллионы",
      "html": "<p>Теперь о том, чего это стоит, — честно и без фантастики. Предобучение большой модели — это не «запустил на ночь на ноутбуке». Это тысячи, а у флагманов — десятки тысяч специализированных графических процессоров (GPU), работающих без остановки месяцами. Почему именно графических? Потому что вся математика нейросети — это гигантские таблицы умножения: миллиарды весов надо перемножить с миллиардами чисел, и GPU, созданные когда-то для отрисовки игровой графики, умеют делать тысячи таких умножений одновременно. Стоимость обучения одной большой модели — десятки, а у самых крупных — сотни миллионов долларов. Энергии такой вычислительный кластер потребляет мегаватты — как небольшой посёлок.</p><div class=\"example\"><p>Открытая Llama 3 на 405 миллиардов параметров: около 15 триллионов токенов корпуса, 16 тысяч GPU, порядка 30 миллионов GPU-часов — это два-три месяца непрерывного счёта. Только вычисления, по рыночным ценам аренды, — несколько десятков миллионов долларов. И это ещё не флагман индустрии.</p></div><p>Для равновесия — две оговорки. Во-первых, модели поменьше обучают заметно дешевле: счёт идёт на сотни тысяч и миллионы долларов, и этим занимаются десятки лабораторий, а не три корпорации. Во-вторых, вся эта цена платится <em>один раз</em>. Обученные веса — просто файл; дальше им пользуются миллионы людей, и каждый отдельный ответ обходится уже в доли цента.</p><p>И ещё одно следствие, важное для понимания ваших разговоров с ChatGPT или Claude: после предобучения веса замораживаются. Когда вы переписываетесь с моделью, она <strong>не</strong> доучивается, ваши сообщения не подкручивают её гирьки. Обучение — редкое, дорогое, отдельное событие; разговор — просто использование готовых весов.</p>"

    {
      "heading": "Базовая модель: эрудит, но не помощник",
      "html": "<p>Что же получается на выходе после месяцев обучения? То, что называют базовой моделью (base model). И вот тут многих ждёт сюрприз: это ещё совсем не ChatGPT.</p><p>Базовая модель — гениальная автодополнялка. Дайте ей начало делового письма — она допишет деловое письмо. Начните стихотворение — продолжит в размер и в рифму. Вставьте половину функции на Python — допишет вторую. Она впитала стили, жанры и интонации всего интернета и продолжит любой текст самым правдоподобным способом.</p><p>Но спросите её: «Как испечь шарлотку?» — и она вполне может ответить так:</p><div class=\"example\"><p>«Как испечь бисквит, чтобы он не осел? Как приготовить творожную запеканку? Чем заменить яйца в выпечке? Ещё 12 вопросов начинающим кулинарам…»</p></div><p>Это не сбой и не издёвка. Модель делает ровно то, чему её учили: продолжает текст. А в интернете за вопросом очень часто идут другие вопросы — на форумах, в блоках «похожие запросы», в списках «часто спрашивают». Значит, список вопросов — статистически отличное продолжение. У базовой модели нет цели помочь вам; у неё вообще нет целей, кроме одной — правдоподобно продолжить.</p><p>Забавно, что знания-то в ней уже есть, просто их приходится выманивать хитростью. Напишите ей не вопрос, а заготовку в духе «Вопрос: как испечь шарлотку? Ответ шеф-повара:» — и она послушно выдаст рецепт, потому что теперь самое правдоподобное продолжение — именно ответ. С ранними моделями примерно так и работали: не просили, а подстраивали текст, в который нужный ответ впишется сам.</p><p>Разрыв между «гениально дополняет текст» и «полезно отвечает человеку» — это отдельная пропасть, и через неё перекинут отдельный мост: дообучение на примерах хороших диалогов и обратной связи от людей. Как именно эрудита-дикаря превращают в вежливого собеседника — весь следующий модуль, про SFT и RLHF.</p>"

      "heading": "Главное",
